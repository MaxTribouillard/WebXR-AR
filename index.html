<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Test</title>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@8.34.0/babylon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@8.34.0/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-serializers@8.34.0/babylonjs.serializers.min.js"></script>

</head>
<body>
    <button id="usdz">
Telecharger usdz
    </button>
    <canvas id="renderCanvas" style="width:100%; height:100vh;"></canvas>

    <script>

        const canvas = document.getElementById('renderCanvas');

        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        const scene = new BABYLON.Scene(engine);
        const light = new BABYLON.HemisphericLight('light1', new BABYLON.Vector3(0, 1, 0), scene);
var camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 5, -10), scene);

    // This targets the camera to scene origin
    camera.setTarget(BABYLON.Vector3.Zero());

    // This attaches the camera to the canvas
    camera.attachControl(canvas, true);


        async function loadModel() {
            try {
                const result = await BABYLON.ImportMeshAsync("https://web-xr-ar.vercel.app/modelo.glb", scene);
                console.log("Modèle importé avec succès:", result);
                
            } catch (error) {
                console.error("Erreur lors du chargement du modèle:", error);
                console.log("Vérifiez que :");
                console.log("1. Le fichier GLB est accessible à l'URL: https://web-xr-ar.vercel.app/modelo.glb");
                console.log("2. Le fichier GLB est valide et bien formaté");
                console.log("3. Les headers CORS sont configurés correctement sur le serveur");
            }
        }
        
        // Charger le modèle
        loadModel();
        
        // Fonction d'export USDZ (optionnelle)
        async function usdzExport() {
            try {
                const data = await BABYLON.USDZExportAsync(scene);
                BABYLON.Tools.Download(new Blob([data], {type: 'model/vnd.usdz+zip'}), "scene.usdz");
            } catch (error) {
                console.error("Erreur lors de l'export USDZ:", error);
            }
        }

        // Démarrer le rendu
        engine.runRenderLoop(() => {
            scene.render();
        });

        // Gérer le redimensionnement de la fenêtre
        window.addEventListener("resize", () => {
            engine.resize();
        });

        document.getElementById("usdz").addEventListener("click", function () {
            usdzExport()
        })


    </script>


</body>
</html>
