<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Test</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

</head>
<body>

<canvas id="renderCanvas" style="width:100%; height:100vh;"></canvas>

    <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = async function () {
        const scene = new BABYLON.Scene(engine);
        
        // 1. Lumière et Caméra de base (obligatoires pour voir quelque chose)
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 10, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        const baseUrl = "https://maxtribouillard.github.io/WebXR-AR/";
        const fileName = "LEO_009%20-%202026%20-%20PROJET0008%20-%20PROP01.babylon";

        try {
            // 2. Utiliser la version Async de Append pour être sûr de l'ordre d'exécution
            await BABYLON.SceneLoader.AppendAsync(baseUrl, fileName, scene);
            console.log("Chargement terminé !");

            // 3. Ajustement automatique de la caméra au modèle chargé
            scene.createDefaultCameraOrLight(true, true, true);
            scene.activeCamera.attachControl(canvas, true);

            // 4. Configuration XR
            const ground = scene.getMeshByName("ground");
            const xr = await scene.createDefaultXRExperienceAsync({
                floorMeshes: ground ? [ground] : [] 
            });
            console.log("Mode XR prêt !");

        } catch (err) {
            console.error("Erreur lors du chargement :", err);
        }

        return scene;
    };

    // Initialisation
    createScene().then(scene => {
        engine.runRenderLoop(function () {
            if (scene) {
                scene.render();
            }
        });
    });

    window.addEventListener("resize", () => engine.resize());
</script>


</body>
</html>
