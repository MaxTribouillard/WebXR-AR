<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Test</title>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@8.40.1/babylon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@8.40.1/babylonjs.loaders.min.js"></script>
</head>
<body>

    <canvas id="renderCanvas" style="width:100%; height:100vh;"></canvas>

    <script>

        const canvas = document.getElementById('renderCanvas');

        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        const scene = new BABYLON.Scene(engine);
        const light = new BABYLON.HemisphericLight('light1', new BABYLON.Vector3(0, 1, 0), scene);
var camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 5, -10), scene);

    // This targets the camera to scene origin
    camera.setTarget(BABYLON.Vector3.Zero());

    // This attaches the camera to the canvas
    camera.attachControl(canvas, true);


        async function loadModel() {
            try {
                console.log("Chargement du modèle GLB...");
                
                // Vérifier que le loader GLTF est disponible
                if (!BABYLON.SceneLoader.IsPluginForExtensionAvailable(".glb")) {
                    console.error("Le plugin GLB/GLTF n'est pas disponible");
                    return;
                }
                
                // Charger le modèle GLB
                const result = await BABYLON.SceneLoader.ImportMeshAsync("", "https://web-xr-ar.vercel.app/", "modelo.glb", scene);
                console.log("Modèle importé avec succès:", result);
                
                // Vérifier si des meshes ont été importés
                if (result.meshes && result.meshes.length > 0) {
                    console.log("Nombre de meshes importés:", result.meshes.length);
                    
                    // Traiter tous les meshes importés
                    result.meshes.forEach((mesh, index) => {
                        console.log(`Mesh ${index}:`, mesh.name);
                    });
                    
                    // Positionner le mesh racine
                    const rootMesh = result.meshes[0];
                    if (rootMesh) {
                        rootMesh.position = new BABYLON.Vector3(0, 0, 0);
                        
                        // Calculer la boîte englobante pour ajuster la caméra
                        const boundingInfo = rootMesh.getBoundingInfo();
                        if (boundingInfo) {
                            const size = boundingInfo.boundingBox.maximum.subtract(boundingInfo.boundingBox.minimum);
                            const maxDimension = Math.max(size.x, size.y, size.z);
                            console.log("Taille du modèle:", size, "Max dimension:", maxDimension);
                            
                            // Ajuster la position de la caméra
                            camera.position = new BABYLON.Vector3(0, maxDimension, maxDimension * 2);
                            camera.setTarget(BABYLON.Vector3.Zero());
                        }
                    }
                } else {
                    console.warn("Aucun mesh trouvé dans le modèle");
                }
            } catch (error) {
                console.error("Erreur lors du chargement du modèle:", error);
                console.log("Vérifiez que :");
                console.log("1. Le fichier GLB est accessible à l'URL: https://web-xr-ar.vercel.app/modelo.glb");
                console.log("2. Le fichier GLB est valide et bien formaté");
                console.log("3. Les headers CORS sont configurés correctement sur le serveur");
            }
        }
        
        // Charger le modèle
        loadModel();
        
        // Fonction d'export USDZ (optionnelle)
        async function usdzExport() {
            try {
                const data = await BABYLON.USDZExportAsync(scene);
                BABYLON.Tools.Download(new Blob([data], {type: 'model/vnd.usdz+zip'}), "scene.usdz");
            } catch (error) {
                console.error("Erreur lors de l'export USDZ:", error);
            }
        }

        // Démarrer le rendu
        engine.runRenderLoop(() => {
            scene.render();
        });

        // Gérer le redimensionnement de la fenêtre
        window.addEventListener("resize", () => {
            engine.resize();
        });

    </script>
</body>
</html>
