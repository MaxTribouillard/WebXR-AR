<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Test</title>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@8.34.0/babylon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@8.34.0/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-serializers@8.34.0/babylonjs.serializers.min.js"></script>

</head>
<body>

Telecharger usdz

<canvas id="renderCanvas" style="width:100%; height:100vh;"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            
            // Une caméra par défaut est nécessaire avant d'entrer en XR
            const camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 5, -10), scene);
            camera.setTarget(BABYLON.Vector3.Zero());
            camera.attachControl(canvas, true);

            // Lumière basique (importante si ton modèle n'en a pas d'intégrée)
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

            // Chargement du modèle
            const baseUrl = "https://vr.leonard-solutions.com/temp_Projet/888888/";
            const fileName = "LEO_009%20-%202026%20-%20PROJET0009%20-%20PROP01.babylon";

            BABYLON.SceneLoader.Append(baseUrl, fileName, scene, async function () {
                // On récupère le sol pour la téléportation
                let ground = scene.getMeshByName("ground");
                
                // Configuration XR
                const xr = await scene.createDefaultXRExperienceAsync({
                    floorMeshes: ground ? [ground] : [] 
                });

                console.log("Mode XR prêt !");
            });

            return scene;
        };

        // Initialisation et boucle de rendu
        createScene().then(scene => {
            engine.runRenderLoop(function () {
                scene.render();
            });
        });

    </script>


</body>
</html>
